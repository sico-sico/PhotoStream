<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PhotoStream">
  <title>PhotoStream</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b3f" />
      <stop offset="1" stop-color="#0c0f16" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fb0ff" />
      <stop offset="1" stop-color="#4b7bf0" />
    </linearGradient>
  </defs>

  <!-- App tile. The radius matches Windows 11 app icons (22.5% of the side). -->
  <rect width="512" height="512" rx="115" fill="url(#bg)" />

  <!--
    A masonry wall: two columns whose rows are offset, which is the app's own
    layout. Four tiles rather than nine, because the icon has to read at 16px.

    These proportions were checked by rendering to ASCII at 16, 24 and 32px.
    A 56px margin with 40px gutters keeps every tile at least 3 screen pixels
    wide at 16px, so the four shapes stay distinct instead of merging. The
    columns are different heights on purpose: equal ones read as a plain grid,
    and the offset is what makes it a masonry wall rather than a window icon.
  -->
  <rect x="56" y="56" width="184" height="184" rx="34" fill="#e8e8ee" />
  <rect x="56" y="272" width="184" height="184" rx="34" fill="url(#accent)" />
  <rect x="280" y="56" width="184" height="184" rx="34" fill="#e8e8ee" fill-opacity="0.38" />
  <rect x="280" y="272" width="184" height="184" rx="34" fill="#e8e8ee" fill-opacity="0.72" />
</svg>
