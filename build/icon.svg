<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PhotoStream">
  <title>PhotoStream</title>
  <!--
    This is the toolbar mark from `src/renderer/components/Logo.tsx` scaled by
    16. The geometry and colours are kept literally identical so the window /
    taskbar icon and the icon in the app's top-left corner are the same mark.
    Change both files together.
  -->

  <!-- App tile. -->
  <rect width="512" height="512" rx="128" fill="#2a3147" />

  <!--
    Masonry wall: two columns whose rows are offset, which is the app's own
    layout. Four tiles rather than nine, because the icon has to read at 16px.
  -->
  <rect x="80" y="80" width="160" height="160" rx="35.2" fill="#e8e8ee" />
  <rect x="80" y="272" width="160" height="160" rx="35.2" fill="#5b8cff" />
  <rect x="272" y="80" width="160" height="112" rx="35.2" fill="#e8e8ee" fill-opacity="0.42" />
  <rect x="272" y="224" width="160" height="208" rx="35.2" fill="#e8e8ee" fill-opacity="0.74" />
</svg>
